name: Temp fetch FPKG tools artifact

on:
  push:
    branches:
      - tmp-fpkgtools-rc0-20261003
    paths:
      - ".github/workflows/_temp_stage_fpkgtools.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public CyB1K v7 archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87/releases/download/v7/PS4_Fake_PKG_Tools_3.87_V7.rar"             -o PS4_Fake_PKG_Tools_3.87_V7.rar
          sha256sum PS4_Fake_PKG_Tools_3.87_V7.rar > SHA256SUMS.txt
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: fpkgtools-v7-public-temp
          path: |
            PS4_Fake_PKG_Tools_3.87_V7.rar
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
