<!DOCTYPE html>
<html lang="en" manifest="psfree.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tayson PS4 webkit</title>
<style>
html,body{margin:0;background:#0b0f18;color:#c9d5e4;font:16px Arial,Helvetica,sans-serif}
body{padding:18px}
#state{font-size:22px;font-weight:700;line-height:1.4}
#console,#out{display:none}
.success,.ok{color:#71d99b}
.warning,.warn{color:#f0c46a}
.error,.bad{color:#ff6b6b}
#manual-box{margin-top:14px}
#manual-start{padding:10px 14px;border:1px solid #8a6b2d;background:#121821;color:#f0c46a;font-weight:700}
</style>
</head>
<body>
<div id="state">Checking firmware...</div>
<pre id="console"></pre>
<script src="host-config.js?v=20260901-21"></script>
<script>
(function(){
"use strict";
var state=document.getElementById("state");
var config=window.TaysonHostConfig;
var payloadLabel=config&&config.payload?config.payload.label:"GoldHEN";
var m=(navigator.userAgent||"").match(/PlayStation 4[ \/](\d+)\.(\d+)/i);
var fw=m?m[1]+"."+m[2]:"";
var route=config&&config.resolveRoute?config.resolveRoute(fw):null;
function fail(){
 state.textContent="PSFree module failed to load · opening recovery...";
 state.className="error";
 try{localStorage.removeItem(config.families.psfree.cacheKey);}catch(e){}
 setTimeout(function(){
  location.replace("recovery.html?code=MODULE_LOAD_FAILED&family=psfree&fw="+encodeURIComponent(fw||"unknown")+"&detail="+encodeURIComponent("vendor/psfree/alert.mjs"));
 },700);
}
if(!route||!route.verified||route.family!=="psfree"){
 state.textContent=fw?"PS4 "+fw+" · PSFree route unavailable.":"PlayStation 4 required.";
 state.className="warning";
 return;
}
state.textContent="PS4 "+fw+" · loading "+payloadLabel+" with PSFree + Lapse...";
state.className="success";
var s=document.createElement("script");
s.type="module";
s.src="vendor/psfree/alert.mjs";
s.onerror=fail;
document.body.appendChild(s);
}());
</script>
</body>
</html>
