<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tayson PS4 webkit - System Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1 class="main-title"><span class="highlight">Tayson</span> <span class="ps4-text">PS4</span> <span class="webkit-text">webkit</span></h1>
<div class="subtitle">System Check</div>
<div class="version-badge">Low-memory sequential preflight</div>
</header>
<hr class="separator">
<main>
<div class="status-bar"><span id="summary" class="status-text loading">Preparing checks...</span></div>
<div id="checks" class="diagnostic-list"></div>
<p class="compatibility-note">Files are checked one at a time to avoid simultaneous response buffers in memory. No exploit chain is executed.</p>
<div class="action-group"><a class="action-link" href="diagnostics.html">Diagnostics</a><a class="action-link" href="index.html">Return to host</a></div>
</main>
</div>
<script src="host-config.js?v=20260901-21"></script>
<script>
(function(){
"use strict";
var config=window.TaysonHostConfig;
var summary=document.getElementById("summary");
var box=document.getElementById("checks");
var m=(navigator.userAgent||"").match(/PlayStation 4[ \/](\d+)\.(\d+)/i);
var fw=m?m[1]+"."+m[2]:"";
var route=config&&config.resolveRoute?config.resolveRoute(fw):null;
var payloadLabel=config&&config.payload?config.payload.label:"GoldHEN";
var common=["host-config.js?v=20260901-21","router.js?v=20260901-21"];
var familyFiles={
 psfree:["vendor/psfree/alert.mjs","vendor/psfree/psfree.mjs","vendor/psfree/lapse.mjs","payload.bin"],
 css:["vendor/css/src/main.js","vendor/css/src/ps4/constants.js","vendor/css/src/lapse.js","vendor/css/src/payload.bin"],
 lapse:["chain_lapse.js","core.js?v=10","ps4_offsets.js","payload.bin"],
 poops:["chain_poops.js","core.js?v=10","ps4_offsets.js","payload.bin"]
};

function row(name,state){
 var d=document.createElement("div");
 d.className="diagnostic-row";
 var a=document.createElement("span");
 a.textContent=name;
 var b=document.createElement("strong");
 b.textContent=state;
 d.appendChild(a);
 d.appendChild(b);
 box.appendChild(d);
 return b;
}

function checkOne(url,done){
 var out=row(url,"Checking...");
 var x=new XMLHttpRequest();
 x.open("GET",url,true);
 try{x.responseType="arraybuffer";}catch(e){}
 x.onreadystatechange=function(){
  if(x.readyState!==4)return;
  var ok=(x.status>=200&&x.status<300)||(x.status===0&&x.response!==null);
  out.textContent=ok?"Available":"Missing";
  x.onreadystatechange=null;
  x.onerror=null;
  done(!!ok);
  x=null;
 };
 x.onerror=function(){
  out.textContent="Missing";
  x.onreadystatechange=null;
  x.onerror=null;
  done(false);
  x=null;
 };
 try{x.send();}catch(e){
  out.textContent="Missing";
  done(false);
  x=null;
 }
}

if(!fw){
 summary.textContent="Open this page on a PlayStation 4 for firmware-specific checks.";
 summary.className="status-text warning";
 return;
}
if(!route||(!route.verified&&!route.experimental)){
 summary.textContent="PS4 "+fw+" has no enabled route.";
 summary.className="status-text warning";
 return;
}

var files=common.concat(familyFiles[route.family]||[]);
var index=0;
var failed=0;
summary.textContent="PS4 "+fw+" · checking "+files.length+" files sequentially...";

function runNext(){
 if(index>=files.length){
  if(failed){
   summary.textContent=failed+" required file(s) unavailable.";
   summary.className="status-text error";
  }else{
   summary.textContent="System check passed · all required files for "+payloadLabel+" are available.";
   summary.className="status-text success";
  }
  return;
 }
 var url=files[index++];
 checkOne(url,function(ok){
  if(!ok)failed++;
  setTimeout(runNext,0);
 });
}
runNext();
}());
</script>
</body>
</html>
