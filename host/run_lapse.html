<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tayson PS4 webkit - Lapse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1 class="main-title">
            <span class="highlight">Tayson</span>
            <span class="ps4-text">PS4</span>
            <span class="webkit-text">webkit</span>
        </h1>
        <div class="subtitle">Exploit Host</div>
        <div class="version-badge">11.50 · 12.00 · 12.02</div>
    </header>

    <hr class="separator">

    <main id="menu">
        <h2 class="fw-title">Lapse chain</h2>
        <p class="fw-range">Loading the local firmware chain</p>

        <div class="status-bar">
            <span id="state" class="status-text loading">Please wait...</span>
        </div>

        <div id="out" style="display:none;"></div>

        <footer>
            <p class="credit">Designed by <span class="credit-link">Tayson</span></p>
        </footer>
    </main>
</div>

<script type="module">
    import("./chain_lapse.js").catch(function () {
        var stateEl = document.getElementById("state");
        stateEl.textContent = "Failed to load local chain.";
        stateEl.className = "status-text error";
    });
</script>
</body>
</html>
