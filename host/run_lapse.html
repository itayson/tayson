<!DOCTYPE html>
<html lang="en" manifest="slopkit.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tayson PS4 webkit - Lapse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1 class="main-title">
            <span class="highlight">Tayson</span>
            <span class="ps4-text">PS4</span>
            <span class="webkit-text">webkit</span>
        </h1>
        <div class="subtitle">Exploit Host</div>
        <div class="version-badge">Lapse preflight</div>
    </header>

    <hr class="separator">

    <main id="menu">
        <h2 class="fw-title">Lapse chain</h2>
        <p class="fw-range">Verified automatic build: 11.50</p>

        <div class="status-bar">
            <span id="state" class="status-text loading">Checking firmware...</span>
        </div>

        <div id="out" style="display:none;"></div>
        <div class="action-group">
            <a class="action-link" href="diagnostics.html">Diagnostics</a>
            <a class="action-link" href="recovery.html">Recovery</a>
        </div>

        <footer>
            <p class="credit">Designed by <span class="credit-link">Tayson</span></p>
        </footer>
    </main>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var match = (navigator.userAgent || "").match(/PlayStation 4[ \/](\d+)\.(\d+)/i);
    var detectedFw = match ? match[1] + "." + match[2] : "";

    function moduleFailed() {
        stateEl.textContent = "Required local module failed to load · opening recovery...";
        stateEl.className = "status-text error";
        window.setTimeout(function () {
            window.location.replace(
                "recovery.html?code=MODULE_LOAD_FAILED&fw=" +
                encodeURIComponent(detectedFw || "unknown") +
                "&detail=" +
                encodeURIComponent("chain_lapse.js")
            );
        }, 900);
    }

    if (detectedFw !== "11.50") {
        stateEl.textContent = detectedFw ? ("PS4 " + detectedFw + " · Lapse auto-run blocked by preflight.") : "PlayStation 4 required.";
        stateEl.className = "status-text warning";
        return;
    }

    stateEl.textContent = "PS4 11.50 verified · loading local chain...";
    stateEl.className = "status-text success";

    var script = document.createElement("script");
    script.type = "module";
    script.textContent = 'import("./chain_lapse.js").catch(function(){window.__taysonModuleFailed();});';
    window.__taysonModuleFailed = moduleFailed;
    document.body.appendChild(script);
}());
</script>
</body>
</html>
